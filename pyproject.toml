[project]
name = "douyin-auto-down"
version = "0.1.0"
description = "抖音视频下载与微信视频号发布工具"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
# 便于在单一 Python 环境中安装全项目依赖；各服务仍以自己的 pyproject.toml 为准。
services = [
    "f2>=0.0.1.7",
    "fastapi>=0.115.0",
    "gradio>=6.0,<7.0",
    "httpx==0.27.2",
    "loguru>=0.7.3",
    "playwright>=1.50.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.uv]
package = false
