[project]
name = "channels-publisher-api"
version = "0.1.0"
description = "Local API for publishing videos to WeChat Channels through the official creator portal"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "playwright>=1.50.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
channels-publisher-api = "channels_publisher.api:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/channels_publisher"]
